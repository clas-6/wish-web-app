<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a Wish - WISH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' http://localhost:3000;">
</head>
<body class="transition-colors duration-300">

    <!-- Navbar -->
    <nav class="bg-[var(--card-bg)] border-b border-[var(--card-border)] sticky top-0 z-50 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2 sm:gap-3">
                    <img src="img/img 5.png" alt="WISH Logo" class="w-12 h-12 object-contain">
                    <a href="index.html" class="text-inherit font-semibold text-xl tracking-tight">WISH</a>
                </div>
                <div id="auth-links" class="flex items-center gap-3 sm:gap-4">
                    <div class="relative lg:hidden">
                        <button id="mobile-menu-btn" class="w-10 h-10 flex items-center justify-center rounded-xl bg-[#f2f4f7] text-[#667085] hover:bg-[#eaecf0] transition">
                            <i class="fas fa-bars"></i>
                        </button>
                        
                        <div id="mobile-dropdown" class="mobile-dropdown-closed absolute top-12 right-0 w-56 bg-[var(--card-bg)] border border-[var(--card-border)] rounded-2xl p-2 z-[60] shadow-2xl">
                            <div class="flex flex-col gap-1">
                                <a href="index.html" class="flex items-center gap-3 p-3 rounded-xl hover:bg-[#f9fafb] transition text-[#667085]">
                                    <i class="fas fa-home w-5 text-center opacity-70"></i> <span>Home</span>
                                </a>
                                <a href="browse.html?filter=ALL" class="flex items-center gap-3 p-3 rounded-xl hover:bg-[#f9fafb] transition text-[#667085]">
                                    <i class="fas fa-globe w-5 text-center opacity-70"></i> <span>All Wishes</span>
                                </a>
                                <a href="browse.html?filter=DATA" class="flex items-center gap-3 p-3 rounded-xl hover:bg-[#f9fafb] transition text-[#667085]">
                                    <i class="fas fa-wifi w-5 text-center opacity-70"></i> <span>Data</span>
                                </a>
                                <a href="browse.html?filter=AIRTIME" class="flex items-center gap-3 p-3 rounded-xl hover:bg-[#f9fafb] transition text-[#667085]">
                                    <i class="fas fa-phone w-5 text-center opacity-70"></i> <span>Airtime</span>
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 sm:gap-4 auth-buttons-container">
                        <!-- Dynamic content -->
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto px-4 py-12">
        <div class="furni-card overflow-hidden">
            
            <!-- Header -->
            <div class="px-8 py-8 border-b border-[var(--card-border)]">
                <h1 id="form-title" class="text-3xl font-bold text-gray-800">Create a Wish</h1>
                <div id="weekly-allowance-display" class="mt-6 p-5 bg-[#f9fafb] border border-[#f0f0f0] rounded-2xl hidden">
                </div>
            </div>

            <form id="create-wish-form" class="p-8 space-y-6 bg-white">
                <div class="space-y-4 text-gray-700">
                    <div>
                        <label class="block text-sm font-medium mb-1">Phone Number</label>
                        <input type="tel" id="phone" placeholder="08012345678" required 
                               class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition">
                        <p id="phone-error" class="text-red-400 text-xs mt-1 hidden">Please enter a valid Nigerian phone number</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Select Network</label>
                        <select id="network-select" required class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition appearance-none cursor-pointer">
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Select Type</label>
                        <select id="type-select" required class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition appearance-none cursor-pointer">
                        </select>
                    </div>
                    <div id="plan-section" class="hidden">
                        <label class="block text-sm font-medium mb-1">Select Plan</label>
                        <select id="plan-select" class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition appearance-none cursor-pointer">
                        </select>
                    </div>
                    <div id="amount-section">
                        <label class="block text-sm font-medium mb-1">Amount (₦)</label>
                        <input type="number" id="amount" placeholder="eg: 500" 
                               class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition">
                        <p id="amount-error" class="text-red-400 text-xs mt-1 hidden"></p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Message (Optional)</label>
                        <textarea id="message" maxlength="200" placeholder="Tell a short, quiet story..."
                                  class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition h-24 resize-none"></textarea>
                        <div class="text-right text-[10px] opacity-40"><span id="message-counter">0</span>/200</div>
                    </div>

                <div class="pt-8">
                    <button type="submit" class="w-full bg-[#FACC15] text-[#1a1a1a] font-bold py-5 rounded-xl text-lg hover:bg-[#eab308] transition-all shadow-lg">
                        Create Wish
                    </button>
                </div>
            </form>
        </div>

        <!-- Trust note -->
        <div class="text-center mt-8 opacity-60 text-sm">
            This wish will be visible anonymously until it is fully granted.
        </div>
    </main>

    <footer class="bg-[var(--card-bg)] border-t border-[var(--card-border)] py-12 mt-12 text-inherit transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 text-center opacity-60 text-sm">
            © <span id="current-year"></span> WISH • For customer care: <a href="mailto:team.wishapp@gmail.com" class="underline">team.wishapp@gmail.com</a>
        </div>
    </footer>

    <!-- Scripts -->
    <script type="module" src="js/utils.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/wishes.js"></script>
</body>
</html>
