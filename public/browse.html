<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Wishes - WISH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="transition-colors duration-300">

    <!-- Glass Navbar -->
    <nav class="furni-card !rounded-none !border-t-0 !border-x-0 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-[#FACC15] rounded-2xl flex items-center justify-center text-2xl">💛</div>
                    <a href="index.html" class="brand-logo text-inherit">WISH</a>
                </div>
                <div class="flex items-center gap-4">
                    <button id="theme-toggle" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white/10 hover:bg-white/20 transition">
                        <i class="fas fa-moon"></i>
                    </button>
                    <a href="dashboard.html" class="text-sm hover:text-[#FACC15] transition">My Impact</a>
                    <a href="create-wish.html" class="px-5 py-2.5 bg-accent text-primary-dark font-semibold rounded-2xl hover:opacity-90 transition">
                        Post a Wish
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="mb-10 text-center md:text-left">
            <h1 class="text-3xl sm:text-4xl font-semibold mb-3">Open Wishes</h1>
            <p class="opacity-70 text-lg">Choose a wish to grant anonymously and spread kindness today.</p>
        </div>

        <!-- Filters -->
        <div class="flex flex-wrap gap-3 mb-12 justify-center md:justify-start">
            <button class="filter-btn active px-6 py-3 rounded-3xl text-sm font-medium transition-all bg-accent text-primary-dark" data-filter="ALL">
                All Wishes
            </button>
            <button class="filter-btn px-6 py-3 rounded-3xl text-sm font-medium transition-all bg-[var(--card-bg)] backdrop-blur-md border border-[var(--card-border)] hover:opacity-80" data-filter="AIRTIME">
                Airtime
            </button>
            <button class="filter-btn px-6 py-3 rounded-3xl text-sm font-medium transition-all bg-[var(--card-bg)] backdrop-blur-md border border-[var(--card-border)] hover:opacity-80" data-filter="DATA">
                Data
            </button>
            <button class="filter-btn px-6 py-3 rounded-3xl text-sm font-medium transition-all bg-[var(--card-bg)] backdrop-blur-md border border-[var(--card-border)] hover:opacity-80" data-filter="KINDNESS">
                Kindness
            </button>
            <button class="filter-btn px-6 py-3 rounded-3xl text-sm font-medium transition-all bg-[var(--card-bg)] backdrop-blur-md border border-[var(--card-border)] hover:opacity-80" data-filter="CELEBRATION">
                Celebration
            </button>
            <button class="filter-btn px-6 py-3 rounded-3xl text-sm font-medium transition-all bg-[var(--card-bg)] backdrop-blur-md border border-[var(--card-border)] hover:opacity-80" data-filter="EASTER">
                Easter
            </button>
            <button class="filter-btn px-6 py-3 rounded-3xl text-sm font-medium transition-all bg-[var(--card-bg)] backdrop-blur-md border border-[var(--card-border)] hover:opacity-80" data-filter="VALENTINE">
                Valentine
            </button>
            <button class="filter-btn px-6 py-3 rounded-3xl text-sm font-medium transition-all bg-[var(--card-bg)] backdrop-blur-md border border-[var(--card-border)] hover:opacity-80" data-filter="NEW YEAR">
                New Year
            </button>
        </div>

        <!-- Wishes Grid -->
        <div id="browse-wishes-container" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Populated by wishes.js -->
        </div>
    </main>

    <!-- Grant Modal (Updated with glassmorphism) -->
    <div id="grant-modal" class="fixed inset-0 bg-black/60 backdrop-blur-md z-[100] hidden items-center justify-center p-4">
        <div class="furni-card max-w-md w-full overflow-hidden !shadow-2xl">
            
            <div class="px-8 py-6 border-b border-[var(--card-border)]">
                <h3 class="text-2xl font-semibold">Grant this wish</h3>
                <p class="opacity-70 mt-1" id="modal-wish-details">Loading wish details...</p>
            </div>

            <div class="p-8 space-y-8">
                <div id="partial-grant-section" class="hidden">
                    <label class="block text-sm opacity-70 mb-2">How much would you like to grant?</label>
                    <input type="number" id="grant-amount" 
                           class="w-full px-6 py-5 bg-[var(--card-bg)] border border-[var(--card-border)] rounded-2xl text-inherit text-2xl focus:border-accent outline-none">
                </div>

                <div class="bg-[var(--card-bg)] border border-[var(--card-border)] rounded-3xl p-6">
                    <div class="flex justify-between text-sm mb-3">
                        <span class="opacity-70">Wish Total</span>
                        <span class="font-semibold" id="modal-total">₦0</span>
                    </div>
                    <div class="flex justify-between text-lg font-bold border-t border-[var(--card-border)] pt-4">
                        <span>You'll pay</span>
                        <span id="modal-pay-amount" class="text-accent">₦0</span>
                    </div>
                </div>

                <p class="text-center opacity-60 text-sm">
                    You will remain completely anonymous ❤️
                </p>

                <div class="flex gap-4">
                    <button id="close-modal" 
                            class="flex-1 py-4 border border-[var(--card-border)] rounded-2xl font-medium hover:bg-white/5 transition">
                        Cancel
                    </button>
                    <button id="confirm-grant" 
                            class="flex-1 py-4 bg-accent text-primary-dark font-bold rounded-2xl hover:opacity-90 transition">
                        Confirm & Pay
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <script type="module" src="js/utils.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/wishes.js"></script>
    <script type="module" src="js/payments.js"></script>
</body>
</html>
