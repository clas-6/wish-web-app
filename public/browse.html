<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Wishes - Wish</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#F5F3EF] text-[#2E2E2E] font-sans min-h-screen">
    <nav class="bg-white/80 backdrop-blur-sm border-b border-black/5 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <a href="index.html" class="text-lg font-bold tracking-wide text-[#2563eb]">Wish</a>
                </div>
                <div class="flex items-center space-x-6">
                    <div id="nav-links" class="flex items-center space-x-6">
                        <a href="dashboard.html" class="text-sm text-[#7A7A7A] hover:text-[#2E2E2E] transition">Dashboard</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="mb-10">
            <h1 class="text-2xl font-semibold mb-2">Wish feed</h1>
            <p class="text-sm text-[#7A7A7A]">Choose a wish to quietly grant and help someone stay connected.</p>
        </div>

        <div class="flex flex-wrap gap-4 mb-10">
            <button class="filter-btn active bg-[#2563eb] text-white px-6 py-2 rounded-full text-sm font-medium transition" data-filter="ALL">All</button>
            <button class="filter-btn bg-white text-[#2563eb] border border-[#bfdbfe] px-6 py-2 rounded-full text-sm font-medium hover:bg-[#eff6ff] transition" data-filter="AIRTIME">Airtime</button>
            <button class="filter-btn bg-white text-[#2563eb] border border-[#bfdbfe] px-6 py-2 rounded-full text-sm font-medium hover:bg-[#eff6ff] transition" data-filter="DATA">Data</button>
            <button class="filter-btn bg-white text-[#2563eb] border border-[#bfdbfe] px-6 py-2 rounded-full text-sm font-medium hover:bg-[#eff6ff] transition" data-filter="FESTIVE">Festive</button>
            <button class="filter-btn bg-white text-[#2563eb] border border-[#bfdbfe] px-6 py-2 rounded-full text-sm font-medium hover:bg-[#eff6ff] transition" data-filter="KINDNESS">Kindness</button>
        </div>

        <div id="browse-wishes-container" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Wishes will be loaded here -->
            <div class="animate-pulse bg-white rounded-2xl p-6 border border-[#bfdbfe] h-64"></div>
            <div class="animate-pulse bg-white rounded-2xl p-6 border border-[#bfdbfe] h-64"></div>
            <div class="animate-pulse bg-white rounded-2xl p-6 border border-[#bfdbfe] h-64"></div>
        </div>
    </main>

    <div id="grant-modal" class="fixed inset-0 bg-black/40 z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full overflow-hidden shadow-2xl transform transition-all">
            <div class="px-6 py-5 bg-[#F9F5EE] border-b border-[#E0D5C5]/70">
                <h3 class="text-lg font-semibold">Grant wish</h3>
                <p class="text-sm text-[#7A7A7A]" id="modal-wish-details">Loading...</p>
            </div>
            <div class="p-8 space-y-6">
                <div id="partial-grant-section" class="hidden">
                    <label class="block text-xs font-medium text-[#7A7A7A] mb-2">Amount to grant (₦)</label>
                    <input type="number" id="grant-amount" class="w-full px-4 py-3 rounded-2xl border border-[#E0D5C5] bg-[#F9F5EE] focus:border-[#d9a441] transition outline-none" placeholder="Enter amount">
                    <p class="text-[11px] text-[#7A7A7A] mt-2">Minimum: ₦100. Remaining: ₦<span id="modal-remaining">0</span></p>
                </div>
                
                <div class="bg-[#F9F5EE] p-4 rounded-2xl border border-[#E0D5C5]/70">
                    <div class="flex justify-between mb-2">
                        <span class="text-xs text-[#7A7A7A]">Wish amount</span>
                        <span class="font-bold" id="modal-total">₦0</span>
                    </div>
                    <div class="flex justify-between text-[#2E2E2E] font-semibold text-sm pt-2 border-t border-[#E0D5C5]/70">
                        <span>Total to pay</span>
                        <span id="modal-pay-amount">₦0</span>
                    </div>
                    <p class="text-[10px] text-[#7A7A7A] mt-2 text-center italic">Includes a small processing fee.</p>
                </div>

                <p class="text-[11px] text-[#7A7A7A] text-center">You’ll remain anonymous.</p>

                <div class="flex gap-4">
                    <button id="close-modal" class="flex-1 px-6 py-3 border border-[#E0D5C5] rounded-full text-sm font-medium hover:bg-[#F9F5EE] transition-colors">Cancel</button>
                    <button id="confirm-grant" class="flex-1 bg-[#2E2E2E] text-white px-6 py-3 rounded-full text-sm font-medium hover:bg-black transition-colors">Grant anonymously</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/utils.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/wishes.js"></script>
    <script type="module" src="js/payments.js"></script>
</body>
</html>
