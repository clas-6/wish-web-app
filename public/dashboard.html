<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Impact - WISH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="transition-colors duration-300">

    <!-- Glass Navbar -->
    <nav class="furni-card !rounded-none !border-t-0 !border-x-0 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-accent rounded-2xl flex items-center justify-center text-2xl">💛</div>
                    <a href="index.html" class="brand-logo text-inherit">WISH</a>
                </div>
                <div class="flex items-center gap-6">
                    <a href="browse.html" class="text-sm hover:text-[#FACC15] transition">Browse Wishes</a>
                    <a href="create-wish.html" class="px-5 py-2.5 bg-[var(--accent)] text-[var(--primary-dark)] font-semibold rounded-2xl hover:bg-yellow-300 transition">
                        Make a Wish
                    </a>
                    <button id="logout-btn" class="text-sm hover:text-[#FACC15] transition">Log out</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="flex flex-col md:flex-row md:items-end justify-between mb-12">
            <div>
                <h1 class="text-3xl sm:text-4xl font-semibold">Your Kindness Impact</h1>
                <p class="opacity-70 text-lg mt-2" id="user-email">Welcome back</p>
            </div>
            <div class="mt-6 md:mt-0">
                <a href="create-wish.html" class="furni-btn-primary block text-center">Make a Wish</a>
            </div>
        </div>

        <div class="grid lg:grid-cols-12 gap-8">
            
            <!-- Stats Cards -->
            <div class="lg:col-span-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 gap-6">
                <div class="furni-card p-8">
                    <div class="flex items-center gap-4">
                        <div class="w-14 h-14 bg-accent-muted rounded-2xl flex items-center justify-center text-3xl">🌟</div>
                        <div>
                            <p class="opacity-70 text-sm">My Wishes</p>
                            <p class="text-5xl font-bold mt-1" id="stat-wishes">0</p>
                        </div>
                    </div>
                </div>

                <div class="furni-card p-8">
                    <div class="flex items-center gap-4">
                        <div class="w-14 h-14 bg-accent-muted rounded-2xl flex items-center justify-center text-3xl">🤲</div>
                        <div>
                            <p class="opacity-70 text-sm">Wishes Granted</p>
                            <p class="text-5xl font-bold mt-1" id="stat-granted">0</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- My Wishes -->
            <div class="lg:col-span-8">
                <div class="furni-card overflow-hidden">
                    <div class="px-8 py-6 border-b border-[var(--card-border)] flex justify-between items-center">
                        <h2 class="font-semibold text-xl">My Active Wishes</h2>
                        <span class="text-sm opacity-60" id="wish-count">0 wishes</span>
                    </div>
                    
                    <div id="my-wishes-container" class="p-6 space-y-6">
                        <!-- Populated by wishes.js -->
                    </div>
                </div>

                <!-- Transaction / Granted History -->
                <div class="mt-8 furni-card overflow-hidden">
                    <div class="px-8 py-6 border-b border-[var(--card-border)]">
                        <h2 class="font-semibold text-xl">Kindness Given</h2>
                    </div>
                    <div id="transactions-container" class="p-8">
                        <div class="text-center py-16 opacity-60">
                            <p class="text-2xl mb-2">🤲</p>
                            <p>No grants yet. Start spreading kindness!</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <script type="module" src="js/utils.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/wishes.js"></script>
    <script type="module">
        import { triggerConfetti } from './js/utils.js';
        // Check if returning from a successful Paystack payment
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('trxref') || urlParams.has('reference')) {
                triggerConfetti();
            }
        });
    </script>
</body>
</html>
