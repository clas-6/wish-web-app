<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Wish</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#F5F3EF] text-[#2E2E2E] font-sans min-h-screen">
    <nav class="bg-white/80 backdrop-blur-sm border-b border-black/5 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <a href="index.html" class="text-lg font-bold tracking-wide text-[#2563eb]">Wish</a>
                </div>
                <div class="flex items-center space-x-6">
                    <a href="browse.html" class="text-sm text-[#7A7A7A] hover:text-[#2E2E2E] transition">Wish feed</a>
                    <button id="logout-btn" class="text-sm text-[#7A7A7A] hover:text-[#2E2E2E] transition">Log out</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-10 gap-4">
            <div>
                <h1 class="text-2xl font-semibold">Your quiet corner</h1>
                <p class="text-sm text-[#7A7A7A]" id="user-email">Loading...</p>
            </div>
            <a href="create-wish.html" class="px-6 py-3 rounded-full bg-[#2563eb] text-white text-sm font-medium hover:bg-[#1d4ed8] transition-colors text-center">
                Make a wish
            </a>
        </div>

        <div class="grid lg:grid-cols-3 gap-8">
            <!-- Stats -->
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white/90 p-6 rounded-2xl border border-[#E0D5C5]">
                    <h2 class="text-sm font-medium mb-4 text-[#7A7A7A]">Quiet overview</h2>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-[#F9F5EE] p-4 rounded-xl">
                            <p class="text-xs text-[#7A7A7A] font-medium">My wishes</p>
                            <p class="text-xl font-semibold" id="stat-wishes">0</p>
                        </div>
                        <div class="bg-[#F9F5EE] p-4 rounded-xl">
                            <p class="text-xs text-[#7A7A7A] font-medium">Granted</p>
                            <p class="text-xl font-semibold" id="stat-granted">0</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- My Wishes List -->
            <div class="lg:col-span-2">
                <div class="bg-white/90 rounded-2xl border border-[#E0D5C5] overflow-hidden">
                    <div class="px-6 py-4 border-b border-[#E0D5C5]/70 flex justify-between items-center">
                        <h2 class="text-sm font-medium text-[#7A7A7A]">My wishes</h2>
                        <span class="text-xs text-[#7A7A7A]" id="wish-count">0 total</span>
                    </div>
                    <div id="my-wishes-container" class="divide-y divide-[#E0D5C5]/60">
                        <div class="p-12 text-center text-[#7A7A7A] text-sm">
                            <p>You haven't created any wishes yet.</p>
                        </div>
                    </div>
                </div>

                <div class="mt-8 bg-white/90 rounded-2xl border border-[#E0D5C5] overflow-hidden">
                    <div class="px-6 py-4 border-b border-[#E0D5C5]/70">
                        <h2 class="text-sm font-medium text-[#7A7A7A]">Transaction history</h2>
                    </div>
                    <div id="transactions-container" class="divide-y divide-[#E0D5C5]/60">
                        <div class="p-12 text-center text-[#7A7A7A] text-sm">
                            <p>No transactions yet.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="js/utils.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/wishes.js"></script>
</body>
</html>
