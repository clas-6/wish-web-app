<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - WISH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="flex flex-col min-h-screen transition-colors duration-300">
    <!-- Glassmorphism Navbar -->
    <nav class="furni-card !rounded-none !border-t-0 !border-x-0 !shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-[#FACC15] rounded-2xl flex items-center justify-center text-2xl shadow-inner">💛</div>
                    <a href="index.html" class="brand-logo text-inherit">WISH</a>
                </div>
                <div id="auth-links" class="flex items-center gap-4">
                    <button id="theme-toggle" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white/10 hover:bg-white/20 transition">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="furni-card p-8 w-full max-w-md">
            <h1 class="text-2xl font-semibold mb-2 text-center">Create an account</h1>
            <p class="text-sm opacity-70 text-center mb-6">Join quietly. You can always stay anonymous to others.</p>
            
            <form id="register-form" class="space-y-6">
                <div>
                    <label class="block text-xs font-medium opacity-70 mb-1">Email address</label>
                    <input type="email" id="email" required class="furni-input w-full">
                </div>
                <div>
                    <label class="block text-xs font-medium opacity-70 mb-1">Password</label>
                    <input type="password" id="password" required class="furni-input w-full">
                </div>
                <div>
                    <label class="block text-xs font-medium opacity-70 mb-1">Confirm password</label>
                    <input type="password" id="confirm-password" required class="furni-input w-full">
                </div>
                <p class="text-[11px] opacity-70 text-center">Your identity stays private.</p>
                <button type="submit" class="w-full furni-btn-primary">
                    Create account
                </button>
            </form>
            
            <p class="mt-8 text-center opacity-70 text-sm">
                Already have an account? 
                <a href="login.html" class="font-medium underline underline-offset-4">Sign in</a>
            </p>
        </div>
    </main>

    <script type="module" src="js/utils.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
